title: "ringof — a workbench notebook for radios and hardware"
description: >-
  Open-source radio and hardware from ringof — the RX888 mk2 SDR stack, an
  FPGA HF radio, and bench notes on whatever else is in progress.
author: ringof
url: "https://ringof.github.io"
baseurl: ""

github_username: ringof

# Clean, notebook-scoped URLs for blog posts (e.g. /notebook/2026/07/the-rx888/).
permalink: /notebook/:year/:month/:title/

# Search engine ownership verification — emitted as <meta> tags by jekyll-seo-tag.
webmaster_verifications:
  google: EYpURcmg3giAwIumXyRoHkKo-QdoSguogXieyTk3ej0
  bing: 3804FF063F01EBF3145B8D4D3EF09208

encoding: utf-8

# Disable the github-pages default Primer theme; this site has its own layout.
theme:

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
# To enable an Open Graph image for link previews, drop a 1200x630 PNG at
# /assets/og-image.png and add `image: /assets/og-image.png` under values
# above (see SEO playbook tier 2.3).

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - voice.md
  - vendor
  - .jekyll-cache
  - node_modules
