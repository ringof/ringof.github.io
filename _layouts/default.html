<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo -%}
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-nav">
    <a class="site-brand" href="{{ '/' | relative_url }}">ringof</a>
    <nav class="site-links">
      <a href="{{ '/notebook/' | relative_url }}">Notebook</a>
      <a href="{{ '/rx888/' | relative_url }}">RX888</a>
      <a href="https://github.com/ringof">GitHub</a>
    </nav>
  </header>

  <main class="page">
    {{ content }}
    <footer class="site-footer">
      <p>
        A workbench notebook by <a href="https://github.com/ringof">@ringof</a> —
        radios, hardware, and the odd rabbit hole.
        Source: <a href="https://github.com/ringof/ringof.github.io">ringof/ringof.github.io</a>
      </p>
      <div class="site-flag">
        <svg class="pride-flag" viewBox="0 0 30 18" xmlns="http://www.w3.org/2000/svg"
             role="img" aria-label="Progress Pride flag">
          <rect width="30" height="3" y="0"  fill="#E40303"/>
          <rect width="30" height="3" y="3"  fill="#FF8C00"/>
          <rect width="30" height="3" y="6"  fill="#FFED00"/>
          <rect width="30" height="3" y="9"  fill="#008026"/>
          <rect width="30" height="3" y="12" fill="#004DFF"/>
          <rect width="30" height="3" y="15" fill="#750787"/>
          <polygon points="0,0   12,9 0,18"   fill="#000000"/>
          <polygon points="0,1.8 12,9 0,16.2" fill="#613915"/>
          <polygon points="0,3.6 12,9 0,14.4" fill="#5BCEFA"/>
          <polygon points="0,5.4 12,9 0,12.6" fill="#F5A9B8"/>
          <polygon points="0,7.2 12,9 0,10.8" fill="#FFFFFF"/>
        </svg>
      </div>
    </footer>
  </main>
</body>
</html>
